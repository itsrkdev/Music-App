<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <!-- Accent Green Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ed760"/>
      <stop offset="100%" stop-color="#108a3b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="url(#accentGradient)" stroke-width="4" opacity="0.3"/>

  <!-- Equalizer / Wave Background Effect -->
  <g opacity="0.15" fill="#1ed760">
    <rect x="90" y="280" width="16" height="80" rx="8"/>
    <rect x="120" y="220" width="16" height="140" rx="8"/>
    <rect x="376" y="240" width="16" height="120" rx="8"/>
    <rect x="406" y="290" width="16" height="70" rx="8"/>
  </g>

  <!-- Integrated "RK" & Music Note Icon -->
  <g filter="url(#glow)">
    <!-- Main RK + Note Path -->
    <path d="M 160 120 
             L 210 120 
             L 210 330 
             A 45 45 0 1 1 165 285 
             L 210 285
             L 210 190
             L 310 150
             L 310 290
             A 45 45 0 1 1 265 245
             L 310 245
             L 310 120
             Z" 
          fill="url(#accentGradient)"/>

    <!-- 'R' Loop & Diagonal Leg -->
    <path d="M 210 140 
             C 270 140, 270 210, 210 210
             M 225 200
             L 290 285" 
          stroke="url(#accentGradient)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>

    <!-- 'K' Arms integration -->
    <path d="M 310 195 
             L 360 140 
             M 320 185 
             L 370 285" 
          stroke="url(#accentGradient)" 
          stroke-width="32" 
          stroke-linecap="round" 
          fill="none"/>
  </g>
</svg>
